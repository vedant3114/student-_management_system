{% extends 'Home/base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Edit Subject</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="name">Subject Name</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ subject.name }}" required>
        </div>
        <div class="form-group">
            <label for="code">Subject Code</label>
            <input type="text" class="form-control" id="code" name="code" value="{{ subject.code }}" required>
        </div>
        <div class="form-group">
            <label for="description">Description</label>
            <textarea class="form-control" id="description" name="description">{{ subject.description }}</textarea>
        </div>
        <div class="form-group">
            <label for="department">Department</label>
            <select class="form-control" id="department" name="department">
                <option value="">Select Department</option>
                {% for dept in departments %}
                <option value="{{ dept.id }}" {% if subject.department and subject.department.id == dept.id %}selected{% endif %}>{{ dept.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="teacher">Teacher</label>
            <select class="form-control" id="teacher" name="teacher">
                <option value="">Select Teacher</option>
                {% for t in teachers %}
                <option value="{{ t.id }}" {% if subject.teacher and subject.teacher.id == t.id %}selected{% endif %}>{{ t.first_name }} {{ t.last_name }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Update Subject</button>
    </form>
</div>
{% endblock %}
